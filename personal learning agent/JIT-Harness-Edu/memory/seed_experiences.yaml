# 内置教学经验：来自学习科学中被反复验证的常见结论，改写成导师可直接用的经验。
# 用 `python cli.py memory seed` 导入记忆库（agent_id=edu_teacher），上课时按单元自动检索。
# 课后总结出的新经验会以同样格式追加进记忆库。

- content_type: 事实记忆
  text: 【教学经验】记忆类内容，让学生先闭卷回忆再给答案（检索练习），比让他重读一遍记得牢得多；回忆失败后立刻给正确答案效果最好。
- content_type: 事实记忆
  text: 【教学经验】同样的复习量，分散到几次课里做（间隔重复）比一次集中复习保持得更久；复习间隔可以随着记得越来越牢逐步拉长。
- content_type: 事实记忆
  text: 【教学经验】难记的零散信息，引导学生自己造口诀、联想或画面（生成效应），比导师直接给口诀更容易记住。
- content_type: 事实记忆
  text: 【教学经验】词汇、术语每次只引入 3~5 个新项目，并优先抽查上次答错的旧项目，学生负担小、正确率上升快。
- content_type: 程序技能
  text: 【教学经验】新手学解题步骤时，先看完整的带理由样例再模仿（样例学习），比直接让他自己摸索效率高；学生熟练后要逐步撤掉样例，否则反而拖慢（专长逆转）。
- content_type: 程序技能
  text: 【教学经验】给步骤类任务搭支架时，先给完整步骤框架，学生每做对一步就少给一点提示；最后一题要求完全独立完成，才能确认真的会了。
- content_type: 程序技能
  text: 【教学经验】练习时针对最薄弱的一个子步骤出 2~3 道小题集中练（刻意练习），比整题反复做更快补上短板。
- content_type: 问题解决
  text: 【教学经验】学生掌握单一题型后，把不同题型混在一起练（交错练习），并先让他说出“这题用什么方法”，能明显提高考试中辨别题型的能力。
- content_type: 问题解决
  text: 【教学经验】让学生边做边说出思路（出声思考），导师能准确定位他卡在哪一步；导师示范自己的思考过程（包括如何检查答案）也很有效。
- content_type: 问题解决
  text: 【教学经验】展示一个典型的错误解法让学生找错、解释、改正，比只讲正确方法更能防止他以后犯同样的错。
- content_type: 概念理解
  text: 【教学经验】讲新概念前先用学生熟悉的事物类比，讲完一定说明类比在哪里不成立，否则学生会把类比的特征错误地迁移到新概念上。
- content_type: 概念理解
  text: 【教学经验】让学生用自己的话把概念讲给“更小的同学”听（费曼复述），他讲不清的地方就是没真正理解的地方，追问这些点最有效。
- content_type: 概念理解
  text: 【教学经验】学生常带着根深蒂固的朴素概念（如“重的东西下落更快”），直接告诉结论很难改变；先让他预测、再用反例或现象让预测失败，转变更彻底。
- content_type: 概念理解
  text: 【教学经验】文字讲解配上图示或结构描述（双重编码）更容易理解；但图和文字要讲同一件事，无关的装饰反而分散注意力。
- content_type: 表达创作
  text: 【教学经验】写作反馈一次只给一个最值得改的点，并先具体引用学生写得好的一句；一次列出所有问题会打击积极性，而且学生改不过来。
- content_type: 表达创作
  text: 【教学经验】先带学生分析范例的结构和技巧，再给模板仿写一段，最后独立写，比直接布置题目让他写效果好得多。
- content_type: 通用
  text: 【教学经验】每次只推进一小步并及时检测，一次讲太多新内容会超出工作记忆容量，学生听懂了也记不住。
- content_type: 通用
  text: 【教学经验】反馈要具体到“哪里对、哪里错、怎么改”，夸奖努力和方法（“你把条件都列出来了，这个习惯很好”）比夸聪明更能让学生坚持。
- content_type: 通用
  text: 【教学经验】学生连续两次答错时，继续加难度或换一种讲法重复讲都不如退一步：检查前置知识，把任务拆小，给他一次成功的体验。
- content_type: 通用
  text: 【教学经验】每节课开头用 1~2 道题回忆上次内容，结尾请学生用一句话总结本课收获，能明显提高保持率，也方便导师了解掌握情况。
- content_type: 通用
  text: 【教学经验】难度保持在“努力一下能做到”的区间（最近发展区）学生最投入：太简单会走神，太难会放弃；正确率大约七八成比较合适。
